version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parkease_postgres
    restart: always
    environment:
      POSTGRES_USER: parkease
      POSTGRES_PASSWORD: parkease_secret_pass
      POSTGRES_DB: parkease_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkease -d parkease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parkease_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkease_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://parkease:parkease_secret_pass@postgres:5432/parkease_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=parkease_super_secret_jwt_key_2026_change_in_prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
